name: tfsec
permissions: write-all
on:
  pull_request:
    paths:
      - '**/*.tf'
      - '*.tf'
jobs:
  tfsec:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/security-tfsec.yml@master
    secrets:
      GITHUB: ${{ secrets.GITHUB_TOKEN }}
      BUILD_ROLE: ${{ secrets.BUILD_ROLE }}
    with:
      working_directory: './'     